<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical illustration 확인</title><style>:root{
  --paper:#eef2f4;--panel:#ffffff;--band:#e9eff3;--ink:#13202a;--muted:#566874;--line:#c3cfd7;--soft:#f5f8fa;
  --new:#0a6a86;--new-bg:#dcf0f6;--ok:#1d7a4b;--ok-bg:#d9f1e3;--risk:#b3262d;--risk-bg:#fbe2e2;--key:#ffe46b;
  --act:#13202a;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0b1115;--panel:#141d23;--band:#18232b;--ink:#e5ecf0;--muted:#9db0bc;--line:#34444e;--soft:#18232b;
    --new:#5ec5df;--new-bg:#123744;--ok:#63d398;--ok-bg:#153a27;--risk:#ff8d92;--risk-bg:#3e1b1e;--key:#6b5a00;
    --act:#e5ecf0;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:16.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--new)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--new);outline-offset:2px;border-radius:3px}
mark{background:var(--key);color:inherit;padding:0 .12em;border-radius:2px}
mark.ok{background:var(--ok-bg);box-shadow:inset 0 -2px 0 var(--ok)}
mark.risk{background:var(--risk-bg);box-shadow:inset 0 -2px 0 var(--risk)}
svg{display:block;width:100%;height:auto}
figure{margin:0;min-width:0}
figcaption{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.55}
h1{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-0.025em;line-height:1.2;margin:0 0 22px}
h2,h3,h4{letter-spacing:-0.01em;line-height:1.4}
h3{font-size:19px;font-weight:800;margin:30px 0 12px}
h4{font-size:17px;font-weight:700;margin:0 0 4px}
[id]{scroll-margin-top:20px}

/* 레이아웃: 넓은 화면은 왼쪽 목차 + 본문, 좁은 화면은 위쪽 가로 목차 */
.shell{max-width:1440px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
.page{min-width:0;padding:36px 0 80px}
.toc{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:36px 4px 36px 0;font-size:14.5px}
.toc-title{font-weight:800;font-size:13.5px;color:var(--muted);margin:0 0 10px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{margin:0}
.toc a{display:block;color:var(--ink);text-decoration:none;padding:5px 10px;border-left:3px solid transparent;border-radius:0 4px 4px 0;line-height:1.45;transition:background .15s,border-color .15s}
.toc a:hover{background:var(--panel);border-left-color:var(--new)}
.toc ol ol a{font-size:13.5px;color:var(--muted);padding-left:22px}
.toc-topics span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 상단: 회의 개요 / 핵심 메시지 / 백그라운드 */
.hero{border-top:10px solid var(--new);padding-top:28px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;margin-bottom:20px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 26px;min-width:0}
.label{font-size:14px;font-weight:800;color:var(--muted);margin:0 0 12px;letter-spacing:0}
.about{font-size:18px;font-weight:700;line-height:1.5;margin:0 0 14px}
.facts{margin:0;display:grid;gap:8px}
.facts div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px}
.facts dt{color:var(--muted);font-size:15px}
.facts dd{margin:0;font-size:15.5px}
.key{border:2px solid var(--new)}
.headline{font-size:clamp(20px,2.2vw,24px);font-weight:800;line-height:1.5;margin:0 0 14px}
.takeaways{list-style:none;margin:0;padding:0}
.takeaways>li{padding:10px 0 10px 22px;border-top:1px solid var(--line);position:relative}
.takeaways>li::before{content:"";position:absolute;left:3px;top:1.1em;width:9px;height:9px;border-radius:50%;background:var(--new)}

/* 글 목록 */
.bul{margin:0;padding-left:1.15em}
.bul>li{margin:7px 0;padding-left:2px}
.bul.cols{columns:2 360px;column-gap:44px}
.bul.cols>li{break-inside:avoid}
.sub{margin:4px 0 2px;padding-left:1.1em;color:var(--muted);font-size:15.5px}
.sub li{margin:2px 0;list-style:circle}

/* 섹션: 카드 + 머리띠로 구분 */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:28px;padding:0 32px 32px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 -32px 8px;padding:18px 32px;border-radius:12px 12px 0 0;background:var(--band);border-bottom:1px solid var(--line)}
.sec-head h2{font-size:24px;font-weight:800;margin:0;letter-spacing:-0.02em}
.sec-head .anchor{color:var(--muted);text-decoration:none;font-weight:700;opacity:0;transition:opacity .15s}
.sec-head:hover .anchor,.sec-head .anchor:focus-visible{opacity:1}
.sec-head .hint{margin:0 0 0 auto;font-size:14px;color:var(--muted)}
.sec:target,.out:target,.topic:target,.block:target{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--new)}100%{box-shadow:0 0 0 0 transparent}}

/* 회의 요약 */
.overview{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:20px;margin:4px 0 20px}
.ov-tall{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px;min-width:0}
.sw{display:inline-block;width:18px;height:12px;border-radius:2px;border:2px solid}
.sw.ok{background:var(--ok-bg);border-color:var(--ok)}
.sw.new{background:var(--new-bg);border-color:var(--new)}
.sw.risk{background:var(--risk-bg);border-color:var(--risk);border-style:dashed}
.sw.prop{background:var(--panel);border-color:var(--muted);border-style:dashed}
.points{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.points>li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;transition:border-color .15s,background .15s}
.points>li:hover{border-color:var(--new);background:var(--soft)}
.points>li>.num{font-weight:800;font-size:20px;line-height:1.4;color:var(--new)}
.points .bul>li{margin:3px 0}

/* 회의 결과: 위아래로 쌓고, 항목은 제목 | 설명 두 칸 */
.out{margin-top:26px;border-left:6px solid var(--act);padding-left:20px}
.out h3{margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
.out.dec{border-color:var(--ok)}
.out.open{border-color:var(--risk)}
.count{font-size:14px;font-weight:600;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rows>li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:6px 28px;padding:11px 10px;border-bottom:1px solid var(--line);border-radius:4px;transition:background .15s}
.rows>li:hover{background:var(--soft)}
.out.dec .rows b{color:var(--ok)}
.out.open .rows b{color:var(--risk)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-size:14px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);padding:8px 12px}
td{border-bottom:1px solid var(--line);padding:11px 12px;vertical-align:top}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--soft)}
table.actions td:first-child{font-weight:600}
table.actions th:nth-child(2),table.actions th:nth-child(3){width:9em}
table.actions td:nth-child(3){color:var(--muted)}

/* 논의 흐름: 주제마다 접고 펼치기 */
.topic{border:1px solid var(--line);border-radius:10px;margin-top:16px;background:var(--panel);transition:border-color .15s}
.topic[open]{border-color:var(--muted)}
.topic>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;font-size:19.5px;font-weight:800;line-height:1.45;border-radius:10px;transition:background .15s}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary::after{content:"";width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
.topic[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.topic>summary:hover{background:var(--soft)}
.topic .n{display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:16px;font-weight:800;align-items:center;justify-content:center}
.topic-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start;padding:4px 22px 22px}
.topic-grid>*{min-width:0}
.para{margin:0 0 18px}
.para:last-child{margin-bottom:0}
.para h4{font-size:17px;font-weight:800;margin:0 0 4px}
.para p{margin:0}
.topic figure{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:16px;position:sticky;top:16px}

/* 참고 자료 */
details.refs>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 -32px;padding:18px 32px;background:var(--band);font-size:22px;font-weight:800}
details.refs>summary::-webkit-details-marker{display:none}
details.refs>summary::before{content:"+";display:inline-block;width:1em;font-weight:800;color:var(--muted)}
details.refs[open]>summary::before{content:"−"}
details.refs[open]>summary{border-bottom:1px solid var(--line)}
details.refs:not([open]){margin-bottom:-32px}
.reflist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.reflist li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px;min-width:0}
.reflist a{font-weight:600}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:0 7px;border-radius:3px;margin-left:6px;vertical-align:1px;border:1px solid}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.na{color:var(--muted);border-color:var(--muted)}
.badge.diff{color:var(--risk);border-color:var(--risk)}
.impl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 36px}
.impl>div{min-width:0}

@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding:0 20px}
  .toc{position:sticky;top:0;z-index:5;max-height:none;overflow-x:auto;overflow-y:hidden;margin:0 -20px;padding:8px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
  .toc-title,.toc ol ol{display:none}
  .toc>ol{display:flex;gap:4px;white-space:nowrap}
  .toc a{border-left:0;border-bottom:3px solid transparent;border-radius:4px 4px 0 0;padding:6px 10px}
  .toc a:hover{border-bottom-color:var(--new)}
  [id]{scroll-margin-top:64px}
  .page{padding-top:20px}
  .topic-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .topic figure{position:static;max-width:640px}
}
@media (max-width:760px){
  .shell{padding:0 14px}
  .toc{margin:0 -14px;padding:8px 14px}
  body{font-size:16px}
  .hero-grid,.points,.reflist,.impl{grid-template-columns:minmax(0,1fr)}
  .block{padding:18px}
  .sec{padding:0 18px 22px;border-radius:10px}
  .sec-head,details.refs>summary{margin:0 -18px 8px;padding:14px 18px}
  details.refs:not([open]){margin-bottom:-22px}
  .sec-head h2{font-size:21px}
  .sec-head .hint{margin-left:0;flex-basis:100%}
  .overview{padding:12px}
  .ov-wide{display:none}
  .ov-tall{display:block;max-width:440px;margin:0 auto}
  .rows>li{grid-template-columns:minmax(0,1fr);padding:10px 4px}
  .out{padding-left:14px}
  table.actions thead{display:none}
  table.actions,table.actions tbody,table.actions tr,table.actions td{display:block;width:auto}
  table.actions tr{padding:10px 0;border-bottom:1px solid var(--line)}
  table.actions td{border:0;padding:0}
  table.actions td:nth-child(2),table.actions td:nth-child(3){display:inline;font-size:14.5px;color:var(--muted)}
  table.actions td:nth-child(2)::after{content:", "}
  .topic>summary{font-size:17.5px;padding:14px;gap:10px}
  .topic-grid{padding:4px 14px 16px}
}
@media print{
  :root{--paper:#fff;--panel:#fff;--band:#f0f3f5;--soft:#f7f9fa}
  body{background:#fff;font-size:11pt}
  .shell{display:block;padding:0}
  .toc{display:none}
  .ov-wide{display:block}
  .ov-tall{display:none}
  .sec,.topic,figure{break-inside:avoid}
  .topic figure{position:static}
  a{color:inherit}
}

<title id="freeform-title">이동 로봇의 센서 위치와 장애물 회피 경로 개념도</title>

</svg></section><section><h2>annotated</h2><svg viewBox="0 0 560 520" role="img" aria-labelledby="t1-title t1-desc"><title id="t1-title">위에서 본 실내 이동 로봇의 센서와 바퀴 배치</title><desc id="t1-desc">원형 몸체의 앞쪽(그림 위쪽) 가장자리에 카메라가 있으며 카메라는 전방 물체를 인식한다. 몸체 위 중앙에는 LiDAR가 있으며 LiDAR는 주변 장애물까지의 거리를 측정한다. 몸체 좌우에 바퀴가 하나씩 모두 두 개 있다. 설명용 시제품을 개념적으로 배치한 그림이며 비례는 반영하지 않았다.</desc><rect width="560" height="520" fill="var(--paper)"/><polygon points="280,124 268,140 292,140" fill="var(--ink)"/><circle cx="280" cy="260" r="112" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><rect x="156" y="224" width="24" height="72" rx="6" fill="var(--band)" stroke="var(--ink)" stroke-width="1.6"/><rect x="380" y="224" width="24" height="72" rx="6" fill="var(--band)" stroke="var(--ink)" stroke-width="1.6"/><rect x="268" y="148" width="24" height="16" rx="3" fill="var(--band)" stroke="var(--ink)" stroke-width="1.6"/><circle cx="280" cy="260" r="20" fill="var(--band)" stroke="var(--ink)" stroke-width="1.6"/><circle cx="280" cy="260" r="8" fill="var(--ink)"/><path d="M 288 152 L 340 96 L 356 96" fill="none" stroke="var(--muted)" stroke-width="1.2"/><circle cx="288" cy="152" r="3" fill="var(--ink)"/><path d="M 266 248 L 212 96 L 204 96" fill="none" stroke="var(--muted)" stroke-width="1.2"/><circle cx="266" cy="248" r="3" fill="var(--ink)"/><path d="M 168 296 L 168 432 Q 168 440 176 440 L 232 440" fill="none" stroke="var(--muted)" stroke-width="1.2"/><circle cx="168" cy="296" r="3" fill="var(--ink)"/><path d="M 392 296 L 392 432 Q 392 440 384 440 L 328 440" fill="none" stroke="var(--muted)" stroke-width="1.2"/><circle cx="392" cy="296" r="3" fill="var(--ink)"/><text x="364" y="92" fill="var(--ink)" font-size="17" font-weight="700">카메라</text><text x="364" y="116" fill="var(--muted)" font-size="17">전방 물체 인식</text><text x="196" y="60" fill="var(--ink)" font-size="17" font-weight="700" text-anchor="end">LiDAR</text><text x="196" y="84" fill="var(--muted)" font-size="17" text-anchor="end">주변 장애물까지</text><text <section><h2>coverage</h2><svg viewBox="0 0 560 580" role="img" aria-labelledby="t2-title t2-desc"><title id="t2-title">이동 로봇의 카메라 시야와 LiDAR 주변 감지 영역 개념도</title><desc id="t2-desc">위에서 본 원형 이동 로봇입니다. 몸체 전방의 카메라에서 앞쪽으로 부채꼴 모양의 카메라 시야가 펼쳐집니다. 몸체 위 중앙의 LiDAR를 중심으로 주변 감지 영역이 점선 원으로 표시되며, 감지 범위는 미정입니다. 두 영역은 몸체 앞쪽에서 겹칩니다. 축척과 각도는 반영하지 않은 개념도입니다.</desc><rect x="0" y="0" width="560" height="580" fill="var(--paper)"/><circle cx="280" cy="332" r="140" fill="var(--key)" fill-opacity="0.07" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="6,5"/><path d="M 280 272 L 164 108 A 200 200 0 0 1 396 108 Z" fill="var(--key)" fill-opacity="0.15" stroke="var(--muted)" stroke-width="1"/><rect x="204" y="308" width="16" height="48" rx="4" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/><rect x="340" y="308" width="16" height="48" rx="4" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/><circle cx="280" cy="332" r="64" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/><rect x="272" y="264" width="16" height="12" rx="2" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.2"/><circle cx="280" cy="332" r="10" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.2"/><circle cx="280" cy="332" r="3" fill="var(--ink)"/><path d="M 120 488 Q 124 440 176 430" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="180" cy="428" r="3" fill="var(--ink)"/><text x="280" y="304" fill="var(--muted)" font-size="17" text-anchor="middle">카메라</text><text x="280" y="372" fill="var(--muted)" font-size="17" text-anchor="middle">LiDAR</text><text x="404" y="152" fill="var(--ink)" font-size="17" font-weight="600">카메라 시야 · 전방</text><text x="40" y="512" fill="var(--ink)" font-size="17" font-weight="600">주변 감지 영역(범위 미정)</text><text x="280" y="560" fill="var(--muted)" font-size="17" text-anchor="middle">감지 범위 개념도 · 축척·각도 없음</text></svg></section><section><h2>storyboard</h2><svg viewBox="0 0 560 1072" role="img" aria-labelledby="t3-title t3-desc"><title id="t3-title">이동 로봇이 전방 장애물을 발견해 멈춘 뒤 왼쪽으로 방향을 바꿔 장애물 옆을 지나가는 네 장면</title><desc id="t3-desc">위에서 본 같은 로봇과 같은 장애물을 네 장면으로 보여줍니다. 1. 로봇 앞쪽 카메라 시야가 정면의 장애물에 닿아 장애물을 발견합니다. 2. 같은 위치에서 일시 정지합니다. 3. 제자리에서 몸체 방향을 왼쪽으로 돌립니다. 4. 장애물 왼쪽 옆을 지나 앞쪽으로 이동을 재개합니다. 감지 결과를 받은 제어기가 정지와 바퀴 방향 변경을 결정합니다. 경로 길이와 속도는 정하지 않았으며 축척 없는 개념도입니다.</desc><defs><marker id="t3-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="var(--ink)"/></marker></defs><rect width="560" height="1072" fill="var(--paper)"/><g transform="translate(20 16)"><rect x="0" y="0" width="520" height="240" rx="8" fill="var(--band)" stroke="var(--line)" stroke-width="1"/><circle cx="28" cy="28" r="16" fill="var(--ink)"/><text x="28" y="34" font-size="17" font-weight="700" fill="var(--paper)" text-anchor="middle">1</text><text x="56" y="34" font-size="18" font-weight="600" fill="var(--ink)">장애물 발견</text><path d="M260 160 L212 104 L308 104 Z" fill="var(--key)" fill-opacity="0.6" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4,3"/><rect x="204" y="64" width="112" height="40" rx="2" fill="var(--muted)"/><text x="260" y="90" font-size="17" font-weight="600" fill="var(--paper)" text-anchor="middle">장애물</text><text x="328" y="140" font-size="17" fill="var(--ink)">카메라 시야</text><g transform="translate(260 188)"><rect x="-36" y="-12" width="8" height="24" rx="2" fill="var(--ink)"/><rect x="28" y="-12" width="8" height="24" rx="2" fill="var(--ink)"/><circle r="28" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><polygon points="0,-22 -8,-8 8,-8" fill="var(--ink)"/></g><text x="312" y="200" font-size="17" fill="var(--muted)">로봇</text></g><g transform="translate(20 272)"><rect x="0" y="0" width="520" height="240" rx="8" fill="var(--band)" stroke="var(--line)" stroke-width="1"/><circle cx="28" cy="28" r="16" fill="var(--ink)"/><text x="28" y="34" font-size="17" font-weight="700" fill="var(--paper)" text-anchor="middle">2</text><text x="56" y="34 <section><h2>cutaway</h2><svg viewBox="0 0 560 424" role="img" aria-labelledby="t4-title t4-desc"><title id="t4-title">이동 로봇 몸체의 앞쪽 외장을 연 측면 개념도로, 하부의 배터리와 중앙의 제어기 위치를 보여줍니다.</title><desc id="t4-desc">측면에서 본 낮고 둥근 몸체의 앞쪽 절반 외장이 열려 있습니다. 몸체 하부에 납작한 배터리가 있고, 몸체 높이 중앙에 제어기가 있습니다. 제어기는 감지 결과를 받아 정지와 바퀴 방향 변경을 결정합니다. 몸체 위에는 LiDAR, 앞쪽 가장자리에는 카메라가 있고 아래에 바퀴가 있습니다. 배터리의 용량과 사양은 미정입니다. 개념 배치이며 실제 단면은 아닙니다.</desc><line x1="32" y1="292" x2="328" y2="292" stroke="var(--line)" stroke-width="1.5"/><circle cx="200" cy="276" r="16" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="200" cy="276" r="4" fill="var(--muted)"/><path d="M80 120 H260 A40 40 0 0 1 300 160 V220 A40 40 0 0 1 260 260 H80 A40 40 0 0 1 40 220 V160 A40 40 0 0 1 80 120 Z" fill="var(--band)"/><path d="M120 120 H80 A40 40 0 0 0 40 160 V220 A40 40 0 0 0 80 260 H120 L124 240 L112 220 L124 200 L112 180 L124 160 L112 140 Z" fill="var(--panel)"/><path d="M120 120 H260 A40 40 0 0 1 300 160 V220 A40 40 0 0 1 260 260 H120" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="6,4"/><path d="M120 120 H80 A40 40 0 0 0 40 160 V220 A40 40 0 0 0 80 260 H120" fill="none" stroke="var(--ink)" stroke-width="2"/><polyline points="120,120 112,140 124,160 112,180 124,200 112,220 124,240 120,260" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="152" y="100" width="36" height="20" rx="4" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.2"/><text x="170" y="88" fill="var(--muted)" font-size="17" text-anchor="middle">LiDAR</text><circle cx="296" cy="144" r="7" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.2"/><text x="316" y="150" fill="var(--muted)" font-size="17">카메라</text><rect x="132" y="220" width="140" height="24" rx="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/><rect x="148" y="168" width="64" height="32" rx="4" fill="var(--key)" stroke="var(--ink)" stroke-width="1.5"/><line x1="212" y1="184" x2="320" y2="184" stroke="var(--ink)" stroke-width="
